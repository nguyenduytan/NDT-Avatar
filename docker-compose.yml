services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - avatar-cache:/var/cache/nginx/avatar
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
volumes:
  avatar-cache:
