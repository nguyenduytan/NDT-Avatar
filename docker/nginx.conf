limit_req_zone $binary_remote_addr zone=avatar_rate:10m rate=20r/s;
fastcgi_cache_path /var/cache/nginx/avatar levels=1:2 keys_zone=avatars:16m max_size=256m inactive=24h use_temp_path=off;
map $args $bypass_avatar_cache { default 0; ~*(^|&)no-cache(=|&|$) 1; }
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1k;
    client_header_buffer_size 2k;
    large_client_header_buffers 2 8k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location ~ ^/(api(?:/.*)?|health)/?$ {
        limit_req zone=avatar_rate burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass api:9000;
        fastcgi_read_timeout 15s;
        fastcgi_cache avatars;
        fastcgi_cache_key "$request_method|$request_uri|$http_accept";
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_valid 200 24h;
        fastcgi_cache_lock on;
        fastcgi_cache_bypass $bypass_avatar_cache;
        fastcgi_no_cache $bypass_avatar_cache;
        add_header X-NDT-Edge-Cache $upstream_cache_status always;
        # Names may appear in URLs; do not log avatar requests by default.
        access_log off;
    }
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        add_header Access-Control-Allow-Origin "*" always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests","details":{}}}';
    }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
