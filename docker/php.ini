expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
memory_limit=128M
max_execution_time=10
post_max_size=1K
upload_max_filesize=1K
file_uploads=Off
allow_url_fopen=Off
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=64
opcache.max_accelerated_files=2000
